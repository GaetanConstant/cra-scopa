services:
  backend:
    build: ./server
    container_name: scopa-backend
    # SECRET_KEY vit dans server/.env, non versionne : a creer sur le serveur
    # a partir de server/.env.example avant le premier demarrage.
    env_file:
      - ./server/.env
    ports:
      - "5500:5500"
    volumes:
      # Persistance de la base de données SQLite
      - ./server/database.db:/app/database.db
    restart: always

  frontend:
    build: ./client
    container_name: scopa-frontend
    ports:
      - "3300:3300"
    depends_on:
      - backend
    restart: always
