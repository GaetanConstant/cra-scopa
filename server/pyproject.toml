[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt>=5.0.0",
    "fastapi>=0.135.1",
    "passlib>=1.7.4",
    "pyjwt>=2.14.0",
    "python-multipart>=0.0.22",
    "sqlmodel>=0.0.37",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# `main.py` et `conftest.py` sont a la racine du package serveur : sans cela
# l'import de `main` echoue depuis tests/.
pythonpath = [".", "tests"]
testpaths = ["tests"]
